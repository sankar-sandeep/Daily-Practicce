<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    .subscribe-button{
        background-color: rgb(195, 10, 10);
        color: white;
        border: none;
        border-radius: 1px;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 16px;
        padding-right: 16px;
        cursor: pointer;
        margin-right: 5px;
        vertical-align: top;
    }

    .join-button{
        background-color: white;
        color: rgb(10, 102, 194);
        border-radius: 2px;
        border-width: 0.15px;
        border-style: solid;
        border-color: rgb(10, 102, 194);
        padding-top: 9px;
        padding-bottom: 9px;
        padding-left: 16px;
        padding-right: 16px;
        cursor: pointer;
        vertical-align: top;
    }

    .tweet-button{
        background-color: rgb(47, 141, 235);
        color: white;
        font-weight: bold;
        height: 34px;
        width: 74px;
        font-size: 15px;
        margin-left: 5px;
        cursor: pointer;
        border: none;
        border-radius: 18px;
        vertical-align: top;
    }

    .back-button{
        color: black;
        background-color: rgba(203, 184, 184, 0.247);
        border: none;
        border-color: black;
        border-width: 1px;
        border-style: solid;
        border-radius: 3px;
        padding-top: 6px;
        padding-bottom: 6px;
        padding-left: 10px;
        padding-right: 10px;
        cursor: pointer;
        margin-right: 8px;
    }

    .next-button{
        color: black;
        background-color: rgba(203, 184, 184, 0.247);
        border: none;
        border-color: black;
        border-width: 1px;
        border-style: solid;
        border-radius: 3px;
        padding-top: 6px;
        padding-bottom: 6px;
        padding-left: 10px;
        padding-right: 10px;
        cursor: pointer;
        margin-left: 8px;
    }

    .btn {
    background-color: #3498db;
    color: white;
    font-size: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 10px;

    box-shadow: 0 7px 0 #1f5f8b;
    cursor: pointer;
}

.btn:active {
    box-shadow: 0 2px 0 #1f5f8b;
    transform: translateY(5px);
}

.stretch-button{
    background-color: rgb(3, 145, 41);
        color: white;
        border: none;
        border-radius: 1px;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 16px;
        padding-right: 16px;
        cursor: pointer;
        transition: 0.9s;
}

.stretch-button:hover{
    padding: 30px 60px;
    font-size: 30px;
}

.one-button{
    background-color: rgb(3, 145, 41);
    color: white;
    border: none;
    padding-top: 6px;
    padding-bottom: 6px;
    padding-left: 10px;
    padding-right: 10px;
    transition: 0.5s;
    text-align: center;
    margin-left: 15px;
    margin-right: 15px;
    cursor: pointer;
}

.one-button:hover{
    padding-left: 20px;
    padding-right: 20px;
    margin-left: 0px;
    margin-right: 0px;
}

.two-button{
    background-color: rgb(3, 145, 41);
    color: white;
    border: none;
    padding-top: 6px;
    padding-bottom: 6px;
    padding-left: 10px;
    padding-right: 10px;
    text-align: center;
    transition: 0.5s;
    margin-left: 15px;
    margin-right: 15px;
    cursor: pointer;
}

.two-button:hover{
    padding-left: 20px;
    padding-right: 20px;
    margin-left: 0px;
    margin-right: 0px;
}

.three-button{
    background-color: rgb(3, 145, 41);
    color: white;
    border: none;
    padding-top: 6px;
    padding-bottom: 6px;
    padding-left: 10px;
    padding-right: 10px;
    margin-left: 15px;
    margin-right: 15px;
    cursor: pointer;
    transition: 0.5s;
}

.three-button:hover{
    padding-left: 20px;
    padding-right: 20px;
    margin-left: 0px;
    margin-right: 0px;
}
</style>
</head>
<body>
    <button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">TWEET</button>

<br><br>
<button class="back-button">Back</button>
<a href="">1</a>
<a href="">2</a>
<a href="">3</a>
<a href="">4</a>
<a href="">5</a>
<button class="next-button">Next</button>

<br><br>

<button class="btn">Click Me</button>

<br><br>

<button class="stretch-button">Stretch</button>

<br><br>

<button class="one-button">One</button>
<button class="two-button">Two</button>
<button class="three-button">Three</button>
</body>
</html>
