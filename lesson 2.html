<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
     .request-button{
        background-color: black;
        color: white;
        border: none;
        height: 25px;
        width: 90px;
        margin-right: 10px;
        cursor: pointer;
     }

     .cart-button{
        background-color: rgb(255, 216, 20);
        color: black;
        border: none;
        height: 25px;
        width: 125px;
        border-radius: 30px;
        margin-right: 10px;
        cursor: pointer;
     }

     .signup-button{
        background-color: rgb(46, 164, 79);
        color: white;
        border: none;
        border-radius: 3px;
        height: 25px;
        width: 70px;
        font-weight: bold;
        cursor: pointer;
     }

     .getstarted-button{
        background-color: rgb(121, 82, 179);
        color: white;
        border: none;
        border-radius: 3px;
        height: 25px;
        width: 100px;
        font-weight: bold;
        margin-left: 5px;
        cursor: pointer;
    }

    .download-button{
        background-color: white;
        color: gray;
        border-radius: 2px;
        border-color: grey;
        border-width: 0.5px;
        border-style: solid;
        height: 25px;
        width: 80px;
        font-weight: bold;
        cursor: pointer;
    }

    .website-button{
        background-color: rgb(10, 102, 194);
        color: white;
        border: none;
        height: 25px;
        width: 180px;
        border-radius: 50px;
        font-weight: bold;
        margin-right: 5px;
        cursor: pointer;
    }

    .save-button{
        background-color: white;
        color: rgb(10, 102, 194);
        border-width: 0.5px;
        border-color: rgb(10, 102, 194);
        border-style: solid;
        border-radius: 50px;
        height: 30px;
        width: 70px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>
    <button class="request-button"> Request now</button>
<button class="cart-button">Add to Cart</button>
<button class="signup-button">Sign up</button>

<br><br>

<button class="getstarted-button">Get started</button>
<button class="download-button">Download</button>

<br><br>

<button class="website-button">Apply on company website</button>
<button class="save-button">Save</button>
</body>
</html>
