<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .square{
            color: red;
            height: 240px;
            width: 255px;
            background-color: red;
            display: inline-block;
        }

        .circle {
            background-color: green;
            height: 240px;
            width: 255px;
            border: none;
            border-radius: 240px;
            display: inline-block;
            margin-left: 100px;
        }

        .box {
            height: 150px;
            width: 350px;
             border-radius: 2px;
        border-width: 0.15px;
        border-style: solid;
        border-color: rgb(63, 64, 65);
            
        }

        .service {
            padding-top: 30px;
            padding-left: 30px;

        }

        .yes {
            margin-left: 30px;

        }

        .black {
            height: 100px;
            width: 350px;
            background-color: rgb(43, 41, 41);

        }

        .music {
            color: white;
            padding-top: 20px;
            padding-left: 15px;
            font-family: Arial;
            font-weight: bold;
        }

        .music1 {
            color: rgb(96, 96 ,96);
            padding-left: 15px;
            font-family: Arial;

        }
    </style>
</head>
<body>

    <div class="square"></div>
    <div class="circle"></div>
<br><br><br><br>

    <div class="box">
        <p class="service">Saticfied with our service?</p>
        <button class="yes">Yes</button>
        <button class="no">NO</button>
    </div>
    <br><br><br><br>

    <div class="black">
        <p class="music">Install YouTube Music</p>
        <p class="music1">Add Youtube Music to your desktop for quick and easy access</p>
    </div>
    
</body>
</html>
